<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Private Admin Panel</title>

    <link
        rel="stylesheet"
        href="admin.css"
    >

</head>

<!-- Firebase App (Core) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<!-- Firebase Auth -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<!-- Firebase Firestore -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    

<body>


    <!-- ================= LOGIN ================= -->

    <section id="loginPage" class="login-page">

        <div class="login-card">

            <div class="lock">
                🔐
            </div>

            <h1>
                Private Admin
            </h1>

            <p>
                Authorized access only
            </p>


            <form id="loginForm">

                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Admin email"
                    required
                >


                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Password"
                    required
                >


                <button type="submit">
                    Login 🔐
                </button>

            </form>


            <p
                id="loginError"
                class="error"
            ></p>

        </div>

    </section>



    <!-- ================= ADMIN DASHBOARD ================= -->

    <section
        id="adminPage"
        class="admin-page hidden"
    >

        <header class="admin-header">

            <div>

                <p>
                    PRIVATE DASHBOARD
                </p>

                <h1>
                    💌 Date Bookings
                </h1>

            </div>


            <button id="logoutBtn">
                Logout
            </button>

        </header>


        <div class="stats">

            <div class="stat-card">

                <span>
                    💌
                </span>

                <strong id="totalBookings">
                    0
                </strong>

                <small>
                    Total Bookings
                </small>

            </div>


            <div class="stat-card">

                <span>
                    🔴
                </span>

                <strong id="newBookings">
                    0
                </strong>

                <small>
                    New Bookings
                </small>

            </div>

        </div>


        <div id="bookingList">

            <div class="loading">
                Loading bookings...
            </div>

        </div>

    </section>


    <script
        type="module"
        src="admin.js"
    ></script>

</body>

</html>
