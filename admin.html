<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Private Admin Panel</title>

    <link
        rel="stylesheet"
        href="admin.css"
    >

</head>

    

<body>


    <!-- ================= LOGIN ================= -->

    <section id="loginPage" class="login-page">

        <div class="login-card">

            <div class="lock">
                🔐
            </div>

            <h1>
                Private Admin
            </h1>

            <p>
                Authorized access only
            </p>


            <form id="loginForm">

                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Admin email"
                    required
                >


                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Password"
                    required
                >


                <button type="submit">
                    Login 🔐
                </button>

            </form>


            <p
                id="loginError"
                class="error"
            ></p>

        </div>

    </section>



    <!-- ================= ADMIN DASHBOARD ================= -->

    <section
        id="adminPage"
        class="admin-page hidden"
    >

        <header class="admin-header">

            <div>

                <p>
                    PRIVATE DASHBOARD
                </p>

                <h1>
                    💌 Date Bookings
                </h1>

            </div>


            <button id="logoutBtn">
                Logout
            </button>

        </header>


        <div class="stats">

            <div class="stat-card">

                <span>
                    💌
                </span>

                <strong id="totalBookings">
                    0
                </strong>

                <small>
                    Total Bookings
                </small>

            </div>


            <div class="stat-card">

                <span>
                    🔴
                </span>

                <strong id="newBookings">
                    0
                </strong>

                <small>
                    New Bookings
                </small>

            </div>

        </div>


        <div id="bookingList">

            <div class="loading">
                Loading bookings...
            </div>

        </div>

    </section>


    <script
        type="module"
        src="admin.js"
    ></script>

    <!-- ডিলিট করার জন্য কনফার্মেশন পপআপ -->
<div id="deleteModal" class="modal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center;">
    
  <div style="background: #2a1b3d; color: #fff; padding: 25px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); text-align: center; max-width: 350px; width: 90%;">
      
    <h3 style="margin-top: 0;">আপনি কি নিশ্চিত?</h3>
    <p>আপনি কি সত্যি এই বুকিংটি ডিলিট করতে চান?</p>
      
    <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
      <button id="confirmDeleteBtn" style="background: #ff4757; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer;">হ্যাঁ, ডিলিট করুন</button>
      <button id="cancelDeleteBtn" style="background: #57606f; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer;">বাতিল করুন</button>
    </div>
      
  </div>
</div>

</body>

</html>
